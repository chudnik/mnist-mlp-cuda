# Поиск минимального числа нейронов: один скрытый слой.
# Идём от start_neurons с шагом step, на каждой ширине — seeds прогонов.
# Остановка, когда test accuracy каждого seed'а >= target_accuracy.

start_neurons: 32
step: 1
max_neurons: 512
seeds: [42, 43, 44, 45, 46]
target_accuracy: 0.97
criterion: all

base_overrides:
  training:
    epochs: 30
    patience: 5
