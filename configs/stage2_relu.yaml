# Этап 2, E3: 20 000 случайных объектов из train-пула, ReLU, 46 нейронов.
# Отличается от stage2_tanh.yaml только активацией.
seed: 42
device: auto

data:
  root: data
  val_ratio: 0.1
  split_seed: 42
  batch_size: 128
  num_workers: 4
  limit_train: null
  limit_val: null
  train_subset: 20000

model:
  hidden_neurons: 46
  activation: relu
  dropout: 0.2
  batchnorm: true

training:
  epochs: 30
  lr: 0.001
  weight_decay: 0.0001
  patience: 5
  min_delta: 0.0001
  amp: true
  amp_dtype: bf16
  grad_clip: 1.0
  scheduler: plateau
  scheduler_patience: 2
  scheduler_factor: 0.5
  monitor: val_loss

output:
  dir: runs
