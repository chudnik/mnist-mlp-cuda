[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mnist-mlp"
version = "0.1.0"
description = "MLP for handwritten digit recognition (MNIST) trained on CUDA"
requires-python = ">=3.10"
dependencies = [
    "torch",
    "torchvision",
    "numpy",
    "matplotlib",
    "scikit-learn",
    "pyyaml",
    "tqdm",
]

[tool.setuptools.packages.find]
where = ["src"]
